name: CRT Bot
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer un message de contrôle Telegram"
        type: boolean
        default: false
concurrency:
  group: crt-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TREND_MODE: ${{ vars.TREND_MODE }}   # variable de dépôt facultative : structure (défaut), deplacement ou swings
      # variables de dépôt facultatives (voir README) ; vides = valeurs par défaut du code
      NY_ALIGNED: ${{ vars.NY_ALIGNED }}
      CRT_BLOCK_COUNTER_TREND: ${{ vars.CRT_BLOCK_COUNTER_TREND }}
      CRT_REQUIRE_KILLZONE: ${{ vars.CRT_REQUIRE_KILLZONE }}
      CRT_REQUIRE_FVG: ${{ vars.CRT_REQUIRE_FVG }}
      CRT_NEWS_FILTER: ${{ vars.CRT_NEWS_FILTER }}
      CRT_CORRELATION_MODE: ${{ vars.CRT_CORRELATION_MODE }}
      ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
      RISK_PCT: ${{ vars.RISK_PCT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            cache.json
            state.json
            impulse_state.json
            trade_stats.json
            trade_stats_impulse.json
            weekly_outlook_state.json
          key: crt-state-${{ github.run_id }}
          restore-keys: crt-state-
      - run: python bot.py
        env:
          NOTIFY_OK: ${{ github.event.inputs.test == 'true' && '1' || '0' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python impulse.py
        if: always()
        env:
          NOTIFY_OK: ${{ github.event.inputs.test == 'true' && '1' || '0' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python outlook.py
        if: always()
        env:
          NOTIFY_OK: ${{ github.event.inputs.test == 'true' && '1' || '0' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
