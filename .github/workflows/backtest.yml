name: Backtest
on:
  workflow_dispatch:
    inputs:
      sym:
        description: "Actif (ex. R_75, frxEURUSD, cryBTCUSD)"
        default: "R_75"
      days:
        description: "Jours d'historique M5 à rejouer"
        default: "60"
      strategy:
        description: "Stratégie"
        type: choice
        options: [auto, crt, impulse]
        default: auto
      spread_pct:
        description: "Spread aller-retour en % du prix (0 = sans coût)"
        default: "0"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest.py --sym "$SYM" --days "$DAYS" --strategy "$STRATEGY" --spread-pct "$SPREAD" --telegram
        env:
          SYM: ${{ github.event.inputs.sym }}
          DAYS: ${{ github.event.inputs.days }}
          STRATEGY: ${{ github.event.inputs.strategy }}
          SPREAD: ${{ github.event.inputs.spread_pct }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
